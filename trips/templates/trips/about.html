<!DOCTYPE html>
{% extends "trips/base.html" %}
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>درباره پروژه</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: Tahoma, sans-serif; }
        .about-card { border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card about-card p-5 text-center">
                    <h2 class="text-primary mb-4">درباره سامانه رزرو بلیط</h2>
                    <p class="lead">این پروژه به منظور مدیریت هوشمند سفرهای بین‌شهری و تسهیل در فرآیند رزرو صندلی برای مسافران طراحی شده است.</p>
                    <hr>
                    <h5>تکنولوژی‌های به کار رفته:</h5>
                    <div class="mt-3">
                        <span class="badge bg-dark">Python (Django)</span>
                        <span class="badge bg-primary">Bootstrap 5</span>
                        <span class="badge bg-secondary">SQLite</span>
                    </div>
                    <div class="mt-5">
                        <p>طراحی و توسعه توسط: <strong>فاطمه</strong></p>
                        <a href="{% url 'trip_list' %}" class="btn btn-outline-primary mt-3">بازگشت به صفحه اصلی</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
