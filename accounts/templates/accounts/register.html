<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام در سامانه</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px 0;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        .btn-success {
            background-color: #2ecc71;
            border: none;
            border-radius: 8px;
            padding: 10px;
        }
        .btn-success:hover {
            background-color: #27ae60;
        }
        .form-control {
            border-radius: 8px;
            padding: 11px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <div class="card-body">
                    <h3 class="text-center mb-4 text-dark font-weight-bold">ایجاد حساب کاربری جدید</h3>
                    <form method="POST">
                        {% csrf_token %}

                        {{ form.non_field_errors }}
                        <!-- نام و نام خانوادگی -->
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label text-secondary small fw-bold">نام</label>
                                <input type="text" name="first_name" class="form-control" placeholder="مثال: علی" required>
                                {{ form.first_name.errors }}
                            </div>
                            <div class="col">
                                <label class="form-label text-secondary small fw-bold">نام خانوادگی</label>
                                <input type="text" name="last_name" class="form-control" placeholder="مثال: محمدی" required>
                                {{ form.last_name.reeors }}
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">شماره موبایل</label>
                            <input type="text" name="phone_number" class="form-control" placeholder="مثال: 09123456789" required>
                            {{ form.phone_number.errors }}
                        </div>

                        <!-- رمز عبور -->
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">رمز عبور</label>
                            <input type="password" name="password1" class="form-control" placeholder="یک رمز عبور قوی وارد کنید" required>
                            {{ form.password1.errors }}
                        </div>
                        <!--تکرار رمز عبور-->
                        <div class="mb-4">
                            <label class="form-label text-secondary small fw-bold">تکرار رمز عبور</label>
                            <input type="password" name="password2" class="form-control" placeholder="رمز عبور را دوباره وارد کنید " required>
                            {{ form.password2.errors }}
                        </div>

                        <!-- دکمه ثبت نام -->
                        <button type="submit" class="btn btn-success w-100 fw-bold">ثبت نام و ایجاد حساب</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <span class="text-muted small">قبلاً ثبت نام کرده‌اید؟</span>
                        <a href="{% url 'accounts:login' %}" class="text-decoration-none small fw-bold" style="color: #2ecc71;">وارد شوید</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
